name: Frontend SG-SST Hero Build
on:
  pull_request:
    paths:
      - "src/features/landing/**"
      - "public/models/sst/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hero-sst-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compile and validate 3D assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate rigged GLB headers
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          for (const slug of ["profesional_sst", "inspectora_sst", "coordinadora_sst", "auditor_sst"]) {
            const file = "public/models/sst/" + slug + ".glb";
            const bytes = fs.readFileSync(file);
            if (bytes.toString("ascii", 0, 4) !== "glTF" || bytes.readUInt32LE(8) !== bytes.length)
              throw new Error("GLB corrupto: " + file);
            console.log(file + ": OK " + bytes.length + " bytes");
          }
          JS
