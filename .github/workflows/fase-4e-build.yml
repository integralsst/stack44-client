name: Diagnóstico fase 4E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fase-4e-tailwind-nativo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
